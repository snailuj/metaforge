# M03 Stage-2 ablation sweep — runs against the freshly rebuilt live DB
# (`lexicon_v2.db`) after the curated-35k haiku-sm v2 enrichment + rescue
# import + centroid-regression fix. Mirrors `m03_cascade_v1.yaml` exactly
# except for the `db` target, so Stage-1 vs Stage-2 deltas isolate the
# coverage effect (Stage-1 ran at ~97% curated enrichment / 18% centroid;
# Stage-2 runs at 99.3% / 99.3%).
#
# See `docs/roadmap/M03-S03-stage1-findings.md` for the Stage-1 result
# (cascade_full_alpha1.0_additive: +0.1396 separation vs M02 -0.0407).

name: m03_cascade_v2_stage2
db: data-pipeline/output/lexicon_v2.db
pairs: data-pipeline/fixtures/metaphor_pairs_v2.json
controls: data-pipeline/fixtures/munch_inapt.jsonl
mrr_reference: data-pipeline/output/eval_baseline_v2.json

variations:
  # --- M02 baselines (legacy aptness evaluator, no cascade) ---------------
  - name: m02_baseline_jaccard_salience
    scoring: jaccard_salience
    threshold_percentile: 95.0
  - name: m02_baseline_jaccard_raw
    scoring: jaccard_raw
    threshold_percentile: 95.0
  - name: m02_baseline_cosine_salience
    scoring: cosine_salience
    threshold_percentile: 95.0
  - name: m02_baseline_random_uniform
    scoring: random_uniform
    threshold_percentile: 95.0

  # --- Cascade no-gate sanity (must equal m02_baseline_jaccard_salience) --
  - name: cascade_no_gate_no_rerank_sanity
    evaluator: cascade
    concreteness_threshold: -1000000.0
    alpha: 0.0
    ortony_scoring: jaccard_salience
    threshold_percentile: 95.0

  # --- Gate-only ablation: vary the signed concreteness threshold --------
  - name: cascade_gate_only_t0.5
    evaluator: cascade
    concreteness_threshold: 0.5
    alpha: 0.0
    ortony_scoring: jaccard_salience
    threshold_percentile: 95.0
  - name: cascade_gate_only_t0.75
    evaluator: cascade
    concreteness_threshold: 0.75
    alpha: 0.0
    ortony_scoring: jaccard_salience
    threshold_percentile: 95.0
  - name: cascade_gate_only_t1.0
    evaluator: cascade
    concreteness_threshold: 1.0
    alpha: 0.0
    ortony_scoring: jaccard_salience
    threshold_percentile: 95.0
  - name: cascade_gate_only_t1.25
    evaluator: cascade
    concreteness_threshold: 1.25
    alpha: 0.0
    ortony_scoring: jaccard_salience
    threshold_percentile: 95.0
  - name: cascade_gate_only_t1.5
    evaluator: cascade
    concreteness_threshold: 1.5
    alpha: 0.0
    ortony_scoring: jaccard_salience
    threshold_percentile: 95.0
  - name: cascade_gate_only_t1.75
    evaluator: cascade
    concreteness_threshold: 1.75
    alpha: 0.0
    ortony_scoring: jaccard_salience
    threshold_percentile: 95.0
  - name: cascade_gate_only_t2.0
    evaluator: cascade
    concreteness_threshold: 2.0
    alpha: 0.0
    ortony_scoring: jaccard_salience
    threshold_percentile: 95.0

  # --- Re-rank-only ablation: gate off, vary alpha + d_cap --------------
  - name: cascade_rank_only_alpha0.25_dcap0.77
    evaluator: cascade
    concreteness_threshold: -1000000.0
    alpha: 0.25
    d_cap: 0.77
    ortony_scoring: jaccard_salience
    composition: multiplicative
    threshold_percentile: 95.0
  - name: cascade_rank_only_alpha0.5_dcap0.77
    evaluator: cascade
    concreteness_threshold: -1000000.0
    alpha: 0.5
    d_cap: 0.77
    ortony_scoring: jaccard_salience
    composition: multiplicative
    threshold_percentile: 95.0
  - name: cascade_rank_only_alpha1.0_dcap0.77
    evaluator: cascade
    concreteness_threshold: -1000000.0
    alpha: 1.0
    d_cap: 0.77
    ortony_scoring: jaccard_salience
    composition: multiplicative
    threshold_percentile: 95.0

  # --- Full cascade: gate=1.0 (default) + sweep alpha + composition -----
  - name: cascade_full_default
    evaluator: cascade
    concreteness_threshold: 1.0
    alpha: 0.5
    d_cap: 0.77
    ortony_scoring: jaccard_salience
    composition: multiplicative
    threshold_percentile: 95.0
  - name: cascade_full_alpha0.25_mult
    evaluator: cascade
    concreteness_threshold: 1.0
    alpha: 0.25
    d_cap: 0.77
    ortony_scoring: jaccard_salience
    composition: multiplicative
    threshold_percentile: 95.0
  - name: cascade_full_alpha1.0_mult
    evaluator: cascade
    concreteness_threshold: 1.0
    alpha: 1.0
    d_cap: 0.77
    ortony_scoring: jaccard_salience
    composition: multiplicative
    threshold_percentile: 95.0
  - name: cascade_full_alpha0.5_additive
    evaluator: cascade
    concreteness_threshold: 1.0
    alpha: 0.5
    d_cap: 0.77
    ortony_scoring: jaccard_salience
    composition: additive
    threshold_percentile: 95.0
  - name: cascade_full_alpha1.0_additive
    evaluator: cascade
    concreteness_threshold: 1.0
    alpha: 1.0
    d_cap: 0.77
    ortony_scoring: jaccard_salience
    composition: additive
    threshold_percentile: 95.0

  # --- Full cascade: vary d_cap to map the re-rank reward shape ---------
  - name: cascade_full_dcap0.5
    evaluator: cascade
    concreteness_threshold: 1.0
    alpha: 0.5
    d_cap: 0.5
    ortony_scoring: jaccard_salience
    composition: multiplicative
    threshold_percentile: 95.0
  - name: cascade_full_dcap0.65
    evaluator: cascade
    concreteness_threshold: 1.0
    alpha: 0.5
    d_cap: 0.65
    ortony_scoring: jaccard_salience
    composition: multiplicative
    threshold_percentile: 95.0
  - name: cascade_full_dcap0.9
    evaluator: cascade
    concreteness_threshold: 1.0
    alpha: 0.5
    d_cap: 0.9
    ortony_scoring: jaccard_salience
    composition: multiplicative
    threshold_percentile: 95.0
  - name: cascade_full_dcap1.0
    evaluator: cascade
    concreteness_threshold: 1.0
    alpha: 0.5
    d_cap: 1.0
    ortony_scoring: jaccard_salience
    composition: multiplicative
    threshold_percentile: 95.0
