<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { width:700px; background:var(--colour-bg-primary); color:var(--colour-text-primary);
    font-family:var(--font-body); padding:22px 26px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--colour-text-muted); margin-bottom:14px; }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--colour-text-muted); }
  
</style></head><body>
<div class="label">Body &mdash; Crimson Text</div>
<div style="font-size:19px;line-height:1.5;max-width:560px">A strong desire for something, not food or drink &mdash; the readable old-style serif that carries every definition, chip and label.</div>
<div style="font-style:italic;font-size:16px;color:#a89f94;margin-top:9px">&ldquo;a hungriness for meaning&rdquo; &mdash; italics carry usage examples</div>
<div class="meta" style="margin-top:11px">font-body · 400 / 600 · regular &amp; italic</div></body></html>
