<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { width:700px; background:var(--colour-bg-primary); color:var(--colour-text-primary);
    font-family:var(--font-body); padding:22px 26px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--colour-text-muted); margin-bottom:14px; }
  .glass { background:rgba(22,33,62,0.6); border:1px solid rgba(212,175,55,0.2);
    border-radius:4px; backdrop-filter:blur(8px); }
  .seclabel { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#6b6560; margin-bottom:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:14px; padding:2px 6px; border-radius:3px; cursor:pointer; }
  
</style></head><body>
<div class="label">Word chips &mdash; coloured by relation</div>
<div class="seclabel">Synonyms</div>
<div class="chips" style="margin-bottom:11px"><span class="chip" style="color:#c4956a">hunger</span><span class="chip" style="color:#c4956a">thirst</span><span class="chip" style="color:#c4956a">thirstiness</span><span class="chip" style="color:#c4956a">longing</span><span class="chip" style="color:#c4956a">yearning</span></div>
<div class="seclabel">Broader terms</div>
<div class="chips" style="margin-bottom:11px"><span class="chip" style="color:#8b6f47">desire</span></div>
<div class="seclabel">Narrower terms</div>
<div class="chips" style="margin-bottom:11px"><span class="chip" style="color:#6a8b6f">hankering</span><span class="chip" style="color:#6a8b6f">pining</span><span class="chip" style="color:#6a8b6f">wishfulness</span><span class="chip" style="color:#6a8b6f">wistfulness</span></div>
<div class="seclabel">Collocations</div>
<div class="chips"><span class="chip" style="color:#8ba4b8;background:rgba(212,175,55,0.15)">affection</span><span class="chip" style="color:#8ba4b8;">appetite</span><span class="chip" style="color:#8ba4b8;">cognition</span><span class="chip" style="color:#8ba4b8;">emotion</span><span class="chip" style="color:#8ba4b8;">experience</span></div></body></html>
