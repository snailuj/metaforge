<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { width:700px; background:var(--colour-bg-primary); color:var(--colour-text-primary);
    font-family:var(--font-body); padding:22px 26px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--colour-text-muted); margin-bottom:14px; }
  .glass { background:rgba(22,33,62,0.6); border:1px solid rgba(212,175,55,0.2);
    border-radius:4px; backdrop-filter:blur(8px); }
  .seclabel { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#6b6560; margin-bottom:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:14px; padding:2px 6px; border-radius:3px; cursor:pointer; }
  
</style></head><body>
<div class="label">Search bar &mdash; always visible, &ldquo;/&rdquo; shortcut</div>
<div class="glass" style="display:flex;align-items:center;gap:8px;padding:10px 16px">
  <input style="flex:1;background:transparent;border:none;outline:none;color:#e8e0d4;font-family:var(--font-body);font-size:18px" value="hungriness">
  <span style="font-family:var(--font-mono);font-size:13px;color:#6b6560">/</span>
</div>
<div class="glass" style="display:flex;align-items:center;gap:8px;padding:10px 16px;margin-top:12px">
  <input style="flex:1;background:transparent;border:none;outline:none;color:#6b6560;font-family:var(--font-body);font-size:18px" placeholder="Search for a word…" disabled>
  <span style="font-family:var(--font-mono);font-size:13px;color:#6b6560">/</span>
</div></body></html>
