<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { width:700px; background:var(--colour-bg-primary); color:var(--colour-text-primary);
    font-family:var(--font-body); padding:22px 26px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--colour-text-muted); margin-bottom:14px; }
  .glass { background:rgba(22,33,62,0.6); border:1px solid rgba(212,175,55,0.2);
    border-radius:4px; backdrop-filter:blur(8px); }
  .seclabel { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#6b6560; margin-bottom:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:14px; padding:2px 6px; border-radius:3px; cursor:pointer; }
  
</style></head><body>
<div class="label">Rarity, register &amp; connotation badges</div>
<div style="display:flex;flex-direction:column;gap:13px">
  <div style="display:flex;gap:8px;align-items:center"><span class="meta" style="font-family:var(--font-mono);font-size:11px;color:#6b6560;width:96px">rarity</span>
   <span style="font-size:11px;padding:1px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;color:#8bb89a;background:rgba(139,184,154,.2)">common</span>
   <span style="font-size:11px;padding:1px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;color:#c4956a;background:rgba(196,149,106,.2)">unusual</span>
   <span style="font-size:11px;padding:1px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;color:#a88bc4;background:rgba(168,139,196,.2)">rare</span></div>
  <div style="display:flex;gap:8px;align-items:center"><span style="font-family:var(--font-mono);font-size:11px;color:#6b6560;width:96px">register</span>
   <span style="font-size:11px;padding:1px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;color:#8ba4b8;background:rgba(139,164,184,.2)">poetic</span></div>
  <div style="display:flex;gap:8px;align-items:center"><span style="font-family:var(--font-mono);font-size:11px;color:#6b6560;width:96px">connotation</span>
   <span style="font-size:11px;padding:1px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;color:#8bb89a;background:rgba(106,139,111,.2)">positive</span>
   <span style="font-size:11px;padding:1px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;color:#a89f94;background:rgba(168,159,148,.2)">neutral</span>
   <span style="font-size:11px;padding:1px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;color:#b88b8b;background:rgba(184,139,139,.2)">negative</span></div>
</div></body></html>
