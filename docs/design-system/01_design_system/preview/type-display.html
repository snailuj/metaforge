<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { width:700px; background:var(--colour-bg-primary); color:var(--colour-text-primary);
    font-family:var(--font-body); padding:22px 26px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--colour-text-muted); margin-bottom:14px; }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--colour-text-muted); }
  
</style></head><body>
<div class="label">Display &mdash; Playfair Display</div>
<div style="font-family:var(--font-heading);font-weight:700;font-size:46px;line-height:1.05;color:#d4af37">hungriness</div>
<div style="font-family:var(--font-heading);font-weight:700;font-size:24px;color:#d4af37;margin-top:10px">melancholy &mdash; panel title 24px</div>
<div class="meta" style="margin-top:10px">font-heading · 700 · the searched word &amp; panel titles</div></body></html>
