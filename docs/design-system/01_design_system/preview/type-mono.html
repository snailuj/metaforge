<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { width:700px; background:var(--colour-bg-primary); color:var(--colour-text-primary);
    font-family:var(--font-body); padding:22px 26px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--colour-text-muted); margin-bottom:14px; }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--colour-text-muted); }
  
</style></head><body>
<div class="label">Mono &mdash; JetBrains Mono</div>
<div style="font-family:var(--font-mono);font-size:26px;color:#6b6560">/ &nbsp; &laquo; &nbsp; &raquo;</div>
<div style="font-family:var(--font-mono);font-size:14px;color:#a89f94;margin-top:12px">--colour-accent-gold: #d4af37;</div>
<div class="meta" style="margin-top:11px">font-mono · used sparingly &mdash; the &ldquo;/&rdquo; shortcut hint &amp; code</div></body></html>
