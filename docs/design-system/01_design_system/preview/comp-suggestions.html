<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { width:700px; background:var(--colour-bg-primary); color:var(--colour-text-primary);
    font-family:var(--font-body); padding:22px 26px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--colour-text-muted); margin-bottom:14px; }
  .glass { background:rgba(22,33,62,0.6); border:1px solid rgba(212,175,55,0.2);
    border-radius:4px; backdrop-filter:blur(8px); }
  .seclabel { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#6b6560; margin-bottom:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:14px; padding:2px 6px; border-radius:3px; cursor:pointer; }
  
</style></head><body>
<div class="label">Autocomplete suggestions</div>
<div class="glass" style="background:rgba(22,33,62,0.95);overflow:hidden">
  <div style="display:flex;flex-direction:column;gap:3px;padding:9px 16px;border-bottom:1px solid rgba(212,175,55,0.08);">
    <div style="display:flex;align-items:center;gap:8px"><span style="color:#e8e0d4;font-weight:600;font-size:16px">hunger</span>
    <span style="color:#6b6560;font-size:11px;background:rgba(212,175,55,0.1);padding:1px 6px;border-radius:3px">3 senses</span>
    <span style="font-size:10px;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em;color:#7ec97e;background:rgba(126,201,126,.15)">common</span></div>
    <div style="color:#6b6560;font-size:13px">strong desire for something not food or drink</div></div><div style="display:flex;flex-direction:column;gap:3px;padding:9px 16px;border-bottom:1px solid rgba(212,175,55,0.08);background:rgba(212,175,55,0.12)">
    <div style="display:flex;align-items:center;gap:8px"><span style="color:#e8e0d4;font-weight:600;font-size:16px">hungriness</span>
    
    <span style="font-size:10px;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em;color:#d4af37;background:rgba(212,175,55,.15)">unusual</span></div>
    <div style="color:#6b6560;font-size:13px">strong desire for something not food or drink</div></div><div style="display:flex;flex-direction:column;gap:3px;padding:9px 16px;border-bottom:1px solid rgba(212,175,55,0.08);">
    <div style="display:flex;align-items:center;gap:8px"><span style="color:#e8e0d4;font-weight:600;font-size:16px">hanker</span>
    
    <span style="font-size:10px;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em;color:#c97e7e;background:rgba(201,126,126,.15)">rare</span></div>
    <div style="color:#6b6560;font-size:13px">strong desire for something not food or drink</div></div>
</div></body></html>
