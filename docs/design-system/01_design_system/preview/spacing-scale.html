<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { width:700px; background:var(--colour-bg-primary); color:var(--colour-text-primary);
    font-family:var(--font-body); padding:22px 26px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--colour-text-muted); margin-bottom:14px; }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--colour-text-muted); }
  
</style></head><body>
<div class="label">Spacing scale (rem)</div>
<div style="display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;align-items:center;gap:14px"><span class="meta" style="width:90px">space-xs</span><span style="height:14px;width:4.8px;background:#d4af37;border-radius:2px"></span><span class="meta">0.25rem · 4px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="meta" style="width:90px">space-sm</span><span style="height:14px;width:9.6px;background:#d4af37;border-radius:2px"></span><span class="meta">0.5rem · 8px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="meta" style="width:90px">space-md</span><span style="height:14px;width:19.2px;background:#d4af37;border-radius:2px"></span><span class="meta">1rem · 16px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="meta" style="width:90px">space-lg</span><span style="height:14px;width:28.799999999999997px;background:#d4af37;border-radius:2px"></span><span class="meta">1.5rem · 24px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="meta" style="width:90px">space-xl</span><span style="height:14px;width:38.4px;background:#d4af37;border-radius:2px"></span><span class="meta">2rem · 32px</span></div>
</div></body></html>
