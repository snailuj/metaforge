<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { width:700px; background:var(--colour-bg-primary); color:var(--colour-text-primary);
    font-family:var(--font-body); padding:22px 26px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--colour-text-muted); margin-bottom:14px; }
  .glass { background:rgba(22,33,62,0.6); border:1px solid rgba(212,175,55,0.2);
    border-radius:4px; backdrop-filter:blur(8px); }
  .seclabel { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#6b6560; margin-bottom:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:14px; padding:2px 6px; border-radius:3px; cursor:pointer; }
  @keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="label">Status &amp; loading</div>
<div style="display:flex;gap:40px;align-items:center">
  <div style="text-align:center"><div style="width:40px;height:40px;border:3px solid rgba(212,175,55,0.3);border-top-color:#d4af37;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px"></div><div style="color:#6b6560;font-size:16px">Looking up…</div></div>
  <div style="border-left:1px solid rgba(212,175,55,.15);padding-left:38px">
   <div style="color:#6b6560;font-size:16px;margin-bottom:9px">Type a word to explore</div>
   <div style="color:#c47a7a;font-size:16px">&ldquo;qux&rdquo; was not found in the thesaurus.</div></div>
</div></body></html>
