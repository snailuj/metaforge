<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{width:700px;background:var(--colour-bg-primary);font-family:var(--font-body);color:#e8e0d4;padding:22px 26px}
 .panel{width:320px;background:rgba(22,33,62,0.6);border:1px solid rgba(212,175,55,0.2);border-radius:4px;backdrop-filter:blur(8px);padding:16px}
 h2{font-family:var(--font-heading);color:#d4af37;font-size:24px;font-weight:700;margin-bottom:8px}
 .pos{font-size:12px;color:#a89f94;font-style:italic;display:block;margin-bottom:4px}
 .rb{font-size:10px;padding:1px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;color:#c4956a;background:rgba(196,149,106,.2);vertical-align:middle;margin-left:6px}
 .def{font-size:15px;line-height:1.5;margin-bottom:8px}
 .sl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6b6560;margin:8px 0 4px}
 .wl{display:flex;flex-wrap:wrap;gap:4px}
 .c{font-size:14px;padding:2px 6px;border-radius:3px}
 .usage{font-style:italic;font-size:14px;line-height:1.5;color:#a89f94;border-left:2px solid rgba(212,175,55,.3);padding-left:8px;margin-bottom:14px}
</style></head><body>
<div class="panel">
  <h2>hungriness<span class="rb">unusual</span></h2>
  <span class="pos">noun</span>
  <div class="def">strong desire for something (not food or drink)</div>
  <div class="usage">&ldquo;a hungriness for meaning that no book could satisfy&rdquo;</div>
  <div class="sl">Synonyms</div>
  <div class="wl"><span class="c" style="color:#c4956a">hunger</span><span class="c" style="color:#c4956a">thirst</span><span class="c" style="color:#c4956a">thirstiness</span></div>
  <div class="sl">Broader terms</div>
  <div class="wl"><span class="c" style="color:#8b6f47">desire</span></div>
  <div class="sl">Narrower terms</div>
  <div class="wl"><span class="c" style="color:#6a8b6f">hankering</span><span class="c" style="color:#6a8b6f">pining</span><span class="c" style="color:#6a8b6f">wishfulness</span></div>
</div>
</body></html>
