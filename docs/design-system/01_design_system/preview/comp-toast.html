<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { width:700px; background:var(--colour-bg-primary); color:var(--colour-text-primary);
    font-family:var(--font-body); padding:22px 26px; }
  .label { font-family:var(--font-body); font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--colour-text-muted); margin-bottom:14px; }
  .glass { background:rgba(22,33,62,0.6); border:1px solid rgba(212,175,55,0.2);
    border-radius:4px; backdrop-filter:blur(8px); }
  .seclabel { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#6b6560; margin-bottom:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:14px; padding:2px 6px; border-radius:3px; cursor:pointer; }
  
</style></head><body>
<div class="label">Toast</div>
<div style="display:inline-block;background:#d4af37;color:#1a1a2e;padding:5px 16px;border-radius:4px;font-family:var(--font-body);font-size:15px">Copied &ldquo;hungriness&rdquo;</div>
<div class="meta" style="font-family:var(--font-mono);font-size:11px;color:#6b6560;margin-top:14px">gold pill · bottom-centre · 200ms opacity fade · 1.5s</div></body></html>
